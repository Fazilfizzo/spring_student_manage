spring.application.name=learnspring-jpa

server.port=8070
spring.datasource.url=jdbc:mysql://localhost:3306/database_learn
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.mongodb.uri=mongodb://localhost:27017/studentdb

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.jpa.hibernate.ddl-auto=update
spring.jpa.format-sql=true
spring.jpa.show-sql=true
#spring.jpa.generate-ddl=false

info.app.name=StockFlow
info.app.description=Inventory and Sales Management API
info.app.version=1.0.0

management.server.port=8051
management.endpoints.web.exposure.include=health,info,metrics,prometheus
#management.endpoint.health.show-details=when_authorized


spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


logging.file.name=logs/app.log
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger - %msg%n

spring.devtools.restart.enabled=true

default.id=12